name: Generate Combined Documentation
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'   # nightly at 03:00 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  docs:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Select latest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          swift --version
      - name: Fetch upstream SHA record from docc-publish
        run: |
          git fetch --no-tags origin docc-publish 2>/dev/null \
            && git show origin/docc-publish:.upstream-shas > .upstream-shas 2>/dev/null \
            || true
      - name: Check for upstream changes
        id: check
        run: |
          if [[ "${{ github.event_name }}" != "schedule" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif Scripts/upstream-changed.sh; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish combined documentation
        if: steps.check.outputs.changed == 'true'
        run: ./Scripts/publish-combined-docs.sh
      - name: Record upstream SHAs
        if: steps.check.outputs.changed == 'true'
        run: ./Scripts/upstream-changed.sh --record
      - name: Commit and push to docc-publish
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B docc-publish
          git add docs/ Package.resolved .upstream-shas
          git diff --cached --quiet || git commit -m "docs: regenerate [skip ci]"
          git push --force origin docc-publish
